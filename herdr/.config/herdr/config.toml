onboarding = false
[keys]
prefix = "ctrl+x"
new_workspace = "prefix+t"
rename_workspace = "prefix+$"
previous_agent = "prefix+p"
next_agent = "prefix+n"
previous_tab = "alt+,"
next_tab = "alt+."
split_vertical = ["prefix+|", "prefix+\\"]
split_horizontal = ["prefix+_", "prefix+-"]

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "annotate.capture"
description = "annotate text"

[[keys.command]]
key = "prefix+shift+a"
type = "plugin_action"
command = "annotate.copy-context"
description = "copy annotations as context"

[[keys.command]]
key = "prefix+m"
type = "plugin_action"
command = "annotate.manage"
description = "manage annotations"

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = true
mouse_scroll_lines = 5

status_indicators = "dots"

[ui.sidebar.agents.rows_by_agent]
pi = [
  [
    "state_icon",
    { token = "$session_title", fg = "#a9b1d6", bold = true, dim = false },
  ],
  [
    "agent",
  ],
]

[ui.sound]
enabled = true

[ui.toast]
delivery = "terminal"

[experimental]
kitty_graphics = true

[theme]
name = "tokyo-night"
auto_switch = false
