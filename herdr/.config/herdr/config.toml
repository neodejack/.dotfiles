onboarding = false
[keys]
prefix = "ctrl+x"
new_workspace = "prefix+t"
rename_workspace = "prefix+$"
previous_agent = "prefix+p"
next_agent = "prefix+n"
previous_tab = ""
next_tab = ""
split_vertical = ["prefix+|", "prefix+\\"]
split_horizontal = ["prefix+_", "prefix+-"]

[ui]
agent_panel_sort = "priority"
show_agent_labels_on_pane_borders = false
mouse_scroll_lines = 30

[ui.sound]
enabled = true

[ui.toast]
delivery = "herdr"

[experimental]
kitty_graphics = true
