[tool_alias]
sesame = "github:aliou/sesame"

[tools]
erlang = '28.3.1'
elixir = "1.20.2-otp-28"
node = "26.7.0"
python = "3.14.2"
go = "1.25"
bun = "1.3.8"
just = "latest"
pnpm = "latest"
docker-compose = "5.1.1"
glow = "2.1.2"
kustomize = "5.8.1"
jj = "latest"
ruby = "latest"
"npm:executor" = "latest"
"npm:agent-browser" = "latest"
crane = "latest"

[tools.sesame]
version = "0.12.0"
version_prefix = "@aliou/sesame-cli@"
matching_regex = "^sesame-"
bin = "sesame"

[settings]
python.uv_venv_auto = "create|source"

[settings.npm]
package_manager = "bun"
